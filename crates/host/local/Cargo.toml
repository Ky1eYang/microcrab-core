[package]
name = "microcrab-host-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "local_host"
path = "tests/local_host.rs"

[dependencies]
tracing.workspace = true
async-trait.workspace = true
bytes = "1"
microcrab-host-api.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
globset = "0.4.21"
ignore = "0.4.34"
sha2 = "0.10.9"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "3"
